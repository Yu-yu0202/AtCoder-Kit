[package]
name = "atcoder-kit"
version = "0.1.0"
edition = "2024"
description = "A command-line tool for AtCoder like acc and oj."
license = "MIT"

[[bin]]
name = "ackit"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
confy = "2.0.0"
env_logger = { version = "0.11.10", features = ["color"] }
log = "0.4.29"
regex = { version = "1.12.3", default-features = false, features = ["std", "perf"] }
reqwest = { version = "0.13.3",default-features = false, features = ["json", "cookies", "native-tls"] }
reqwest-middleware = { version = "0.5.1", features = ["form"] }
rpassword = "7.5.2"
scraper = { version = "0.26.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "process", "fs"] }
http = "1.4.0"
serde_json = "1.0.149"
shell-words = "1.1.1"
tempfile = "3.27.0"
dialoguer = { version = "0.12.0", default-features = false, features = ["fuzzy-select"] }
zstd = { version = "0.13.3", default-features = false }
postcard = { version = "1.1.3", features = ["alloc"] }

[build-dependencies]
zstd = "0.13.3"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
